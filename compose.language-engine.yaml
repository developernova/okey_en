services:
  language-engine:
    build:
      context: ./language-engine
    environment:
      LANGUAGE_ENGINE_TOKEN: ${LANGUAGE_ENGINE_TOKEN}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
